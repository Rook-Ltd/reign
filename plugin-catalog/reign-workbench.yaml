description: The Reign desktop app in your browser. `reign workbench` serves the desktop interface through the Reign dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `reign workbench` run and again after each Reign update it runs `npm install --ignore-scripts` (guided by Reign's lockfile) and Vite against your Reign checkout's desktop sources, writing only under ~/.reign/reign-workbench and its own plugin dir (the checkout is only read), and starts `reign dashboard` on loopback when none is running.
