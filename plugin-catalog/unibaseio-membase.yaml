title: Membase
description: "Long-term memory for you and your AI from Membase (membase.com, by Unibase): one memory every connected AI shares. Searches the user's Membase memory before each turn (8 s, fail-open) and adds membase_search, membase_save and membase_profile. Disclosure — user prompts are sent as search queries to the Membase API (api.app.membase.com); with the opt-in capture_turns setting the user's messages are saved there too; on a Reign build with memory.user_store: provider, what Reign' memory tool records about the user is saved to their Membase profile instead of USER.md. MEMBASE_API_KEY comes from the Reign secret scope; the only local file is $REIGN_HOME/unibaseio-membase.json. No background processes, shell commands or telemetry."
maintainer: unibaseio
tier: community
category: memory
requires_reign: ">=0.22.2"
version: "0.3.0"
docs_url: https://github.com/unibaseio/membase/tree/main/integrations/hermes#readme
readme: true
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MEMBASE_API_KEY
