name: Reign Plugin Validate
description: >-
  Validate a Reign plugin (plugin.yaml manifest schema AND
  declared-vs-actually-registered capabilities) using
  `reign plugins validate`. Drop this into your plugin repo's CI:

    - uses: actions/checkout@<sha>
    - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
      with:
        path: .

  The caller's job owns checkout; this action installs Python + reign
  (git install — a supported CI-context install route) and runs the
  validator against your plugin directory.

inputs:
  path:
    description: Path to the plugin directory (containing plugin.yaml).
    default: "."
  reign-ref:
    description: reign git ref (branch/tag/sha) to install and validate with.
    default: "main"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      with:
        version: "0.9.28"
    - name: Set up Python 3.11 (uv)
      shell: bash
      run: |
        uv venv --seed --python 3.11 "$RUNNER_TEMP/py"
        echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$RUNNER_TEMP/py" >> "$GITHUB_ENV"

    - name: Install reign
      shell: bash
      env:
        _REIGN_REF: ${{ inputs.reign-ref }}
      run: |
        set -euo pipefail
        # CI-context install from git; the ref lets plugin authors validate
        # against a pinned reign release instead of main.
        pip install "git+https://github.com/rook-ltd/reign@${_REIGN_REF}"

    - name: Validate plugin
      shell: bash
      env:
        _PLUGIN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        # `reign plugins validate` checks the plugin.yaml manifest schema
        # and loads the plugin in a scratch subprocess to verify that the
        # capabilities it DECLARES match what it actually registers.
        if reign plugins validate "$_PLUGIN_PATH"; then
          echo "✅ PASS: plugin at '$_PLUGIN_PATH' validated cleanly"
        else
          echo "❌ FAIL: plugin at '$_PLUGIN_PATH' failed validation (see output above)"
          exit 1
        fi
