      with: \1sherpa
  # Upstream's `auto` wake-word provider tries openWakeWord first, with the bundled hey_hermes
  # model that decision D2 drops (tools/wakewords is deleted). Reign tries sherpa first: it
  # needs no model and detects the typed phrase, so `auto` keeps working out of the box.
  - files:
    - tools/wake_word.py
    replace:
    - plain: '_PROVIDER_PREFERENCE = ("openwakeword", "sherpa", "porcupine")'
      with: '_PROVIDER_PREFERENCE = ("sherpa", "openwakeword", "porcupine")'
  - files:
