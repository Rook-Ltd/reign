        [#C0C0C0]⠀⠀⠀⣠⠞⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠳⣄⠀⠀⠀[/]

        [#C0C0C0]⠀⠀⣴⠋⠀⠀⠀⠀⠀⠀⣿⣇⣸⣿⣿⣿⣿⣇⣸⣿⠀⠀⠀⠀⠀⠀⠙⣦⠀⠀[/]

        [#FFFFFF]⠀⣼⠃⠀⠀⠀⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠀⠀⠘⣧⠀[/]

        [#FFFFFF]⢰⠇⠀⠀⠀⠀⠀⠀⠀⠀⠈⢻⣿⣿⣿⣿⣿⣿⠟⠁⠀⠀⠀⠀⠀⠀⠀⠀⢸⡆[/]

        [#FFFFFF]⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿[/]

        [#FFFFFF]⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿⣿⣿⣿⣿⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣿[/]

