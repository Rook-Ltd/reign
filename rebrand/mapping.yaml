        \    }\n    const light = {\n      LIGHT_THEME: {\n        color: buildPalette(\n          {\n            accent: '#956E00',\n            bg: '#ffffff',\n            border: '#A56628',\n            error: '#C14240',\n            ok: '#367E39',\n            primary: '#867000',\n            prompt: '#2B2014',\n            shellDollar: '#377BB3',\n            statusBad: '#A65A00',\n            statusCritical: '#B94D4D',\n            statusGood: '#5C7A5C',\n            statusWarn: '#867000',\n            text: '#3D2F13',\n            warn: '#956115'\n          },\n          true\n        )\n      }\n    }\n\n    const cases: Array<[string, string, string]> = ["
  # Last, after the ci.yaml rule that keys on `runs-on: ubuntu-latest`: the account's included
  # hosted minutes ran out (2026-10-09) and every short ubuntu job bills a whole minute, so all
  # Linux jobs run on reign1 too. Windows and macOS lanes have no self-hosted equivalent.
  - files:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
    replace:
      - regex: '(runs-on|runner|default): ubuntu-latest\b(?!-)'
        with:  '\1: self-hosted'
  # Windows and macOS have no self-hosted runner, and hosted minutes on a private repo bill
  # Windows at 2x and macOS at 10x. Joel's call (2026-10-09): those lanes run only on a manual
  # dispatch, and arm64 images build on reign1 under QEMU instead of the paid arm64 runner.
  - files:
      - ".github/workflows/ci.yaml"
    replace:
      - plain: "on:\n  pull_request:\n  push:\n    branches: [main]\n\n"
        with:  "on:\n  pull_request:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\n"
      - regex: "    if: (needs\\.detect\\.outputs\\.(?:python|installer) == 'true'\n    uses: \\./\\.github/workflows/(?:tests-os|installer-tests)\\.yml)"
        with:  "    if: github.event_name == 'workflow_dispatch' && \\1"
  - files:
      - ".github/workflows/install-e2e.yml"
    replace:
      - regex: "  schedule:\n(?:    #[^\n]*\n)*    - cron: [^\n]*\n"
        with:  ""
      - regex: "if: github\\.event_name != 'workflow_dispatch' \\|\\| (contains\\(fromJSON\\('\\[\"all\", \"(?:windows|macos)-desktop\"\\]'\\), inputs\\.route\\))"
        with:  "if: github.event_name == 'workflow_dispatch' && \\1"
  - files:
      - ".github/workflows/docker.yml"
    replace:
      - plain: "runner: ubuntu-latest-32-arm-core"
        with:  "runner: self-hosted"
      - regex: "(?<!# v3\\.7\\.0\n\n)(      - name: Set up Docker Buildx\n        id: buildx\n)"
        with:  "      # reign1 is x64, so arm64 images build under QEMU emulation.\n      - name: Set up QEMU\n        if: matrix.arch == 'arm64'\n        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0\n\n\\1"

  # reign1's CPU is x86-64-v2 (no AVX2), and setup-python's Ubuntu 26.04 builds need
  # x86-64-v3 ("CPU ISA level is lower than required"). uv's Python builds run on v2, so
  # each setup-python step becomes setup-uv plus a seeded venv on PATH (python, pip).
  - files:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/actions/**"
    replace:
      - regex: '(?m)^( *)- (?:name: [^\n]*\n\1  )?uses: actions/setup-python@[0-9a-f]{40}[^\n]*\n\1  with:\n\1    python-version: ["'']?([0-9.]+)["'']?\n'
        with:  '\1- name: Install uv\n\1  uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0\n\1  with:\n\1    version: "0.9.28"\n\1- name: Set up Python \2 (uv)\n\1  shell: bash\n\1  run: |\n\1    uv venv --seed --python \2 "$RUNNER_TEMP/py"\n\1    echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"\n\1    echo "VIRTUAL_ENV=$RUNNER_TEMP/py" >> "$GITHUB_ENV"\n'

  # Install one-liners point at Reign's own installers, not Nous's hosted Hermes ones (the
  # nousresearch.com protect rule otherwise keeps them verbatim and they install Hermes).
  - files:
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install.cmd"
      - "reign_cli/uninstall.py"
      - "reign_cli/update_cmd.py"
      - "reign_cli/update_cmd_maint.py"
      - "skills/autonomous-ai-agents/reign/SKILL.md"
      - "apps/desktop/electron/remote-lifecycle.ts"
      - "apps/desktop/src/i18n/*.ts"
      - "website/docs/**"
    replace:
      - plain: "https://hermes-agent.nousresearch.com/install.sh"
        with:  "https://raw.githubusercontent.com/asxi9832/reign/main/scripts/install.sh"
      - plain: "https://hermes-agent.nousresearch.com/install.ps1"
        with:  "https://raw.githubusercontent.com/asxi9832/reign/main/scripts/install.ps1"

  # The repo is private: REIGN_GITHUB_TOKEN (a read-only fine-grained token) authenticates
  # the installer's clone, and stays in origin's URL so `reign update` fetches keep working.
  # An existing checkout gets the token applied to origin before its fetch.
  - files:
      - "scripts/install.sh"
    replace:
      - plain: "REPO_URL_HTTPS=\"https://github.com/asxi9832/reign.git\"\nREIGN_HOME="
        with:  "REPO_URL_HTTPS=\"https://github.com/asxi9832/reign.git\"\n# Private repo: a read-only GitHub token in REIGN_GITHUB_TOKEN authenticates the clone.\n# It stays in origin's URL so later `reign update` fetches authenticate too.\nif [ -n \"${REIGN_GITHUB_TOKEN:-}\" ]; then\n    REPO_URL_HTTPS=\"https://x-access-token:${REIGN_GITHUB_TOKEN}@github.com/asxi9832/reign.git\"\nfi\nREIGN_HOME="
      - regex: "(?<=stall the installer.\n)            git remote set-branches origin \"\\$BRANCH\""
        with:  "            [ -z \"${REIGN_GITHUB_TOKEN:-}\" ] || git remote set-url origin \"$REPO_URL_HTTPS\"\n            git remote set-branches origin \"$BRANCH\""
  - files:
      - "scripts/install.ps1"
    replace:
      - plain: "$RepoUrlHttps = \"https://github.com/asxi9832/reign.git\"\r\n$PythonVersion"
        with:  "$RepoUrlHttps = \"https://github.com/asxi9832/reign.git\"\r\n# Private repo: a read-only GitHub token in REIGN_GITHUB_TOKEN authenticates the clone.\r\n# It stays in origin's URL so later `reign update` fetches authenticate too.\r\nif ($env:REIGN_GITHUB_TOKEN) {\r\n    $RepoUrlHttps = \"https://x-access-token:$($env:REIGN_GITHUB_TOKEN)@github.com/asxi9832/reign.git\"\r\n}\r\n$PythonVersion"
      - plain: "                }\r\n                git -c windows.appendAtomically=false fetch origin $Branch\r\n"
        with:  "                }\r\n                if ($env:REIGN_GITHUB_TOKEN) { git -c windows.appendAtomically=false remote set-url origin $RepoUrlHttps }\r\n                git -c windows.appendAtomically=false fetch origin $Branch\r\n"

