  - files:
      - "tests/reign_cli/test_config.py"
    replace:
      - regex: 'created by Nous "\n(\s+)"Research\. '
        with:  'created by Rook. "\n\1"'

  - files:
      - "reign_cli/skin_engine.py"
    replace:
      - regex: '(?s)(_REIGN_BRANDING: Dict\[str, str\] = _branding\([^)]*\))(?!\n_REIGN_BRANDING\[)'
        with:  '\1\n_REIGN_BRANDING["agent_name"] = "Reign"\n_REIGN_BRANDING["welcome"] = "Welcome to Reign! Type your message or /help for commands."'

  # Upstream's 32/96-core larger runners don't exist on this account (their jobs queued for a
  # day and were cancelled), so those jobs run on standard GitHub-hosted runners, which are
  # free on a public repo. Those have far fewer cores, so the jobs get longer limits and the
  # test runner picks its worker count from the machine instead of upstream's 96.
  # The repo is public: never map a job to a self-hosted runner, since any fork PR could then
  # run its code on that machine.
  - files:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
    replace:
      - regex: 'runs-on: ubuntu-latest-(?:32|96)-core\n(\s+)timeout-minutes: \d+'
        with:  'runs-on: ubuntu-latest\n\1timeout-minutes: 120'
      - regex: '(runs-on|runner): ubuntu-latest-(?:32|96)-core\b'
        with:  '\1: ubuntu-latest'
      - plain: "runner: windows-latest-32-core"
        with:  "runner: windows-latest"
      - plain: "REIGN_TEST_WORKERS: 96"
        with:  'REIGN_TEST_WORKERS: ""'
  # Upstream later moved CI onto Blacksmith runners and Blacksmith's forks of checkout and the
  # Docker actions. Rook has no Blacksmith account (those jobs would queue forever), so they run
  # on the matching standard GitHub-hosted runners, free on a public repo, with the stock actions.
  # The arm64 rule comes first: the plain one would otherwise match its prefix.
  - files:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/actions/**"
    replace:
      - regex: 'runs-on: blacksmith-(?:16|32)vcpu-(ubuntu-2404|windows-2025)\n(\s+)timeout-minutes: \d+'
        with:  'runs-on: blacksmith-32vcpu-\1\n\2timeout-minutes: 120'
      - regex: '\bblacksmith-\d+vcpu-ubuntu-2404-arm\b'
        with:  'ubuntu-24.04-arm'
      - regex: '\bblacksmith-\d+vcpu-ubuntu-2404\b'
        with:  'ubuntu-latest'
      - regex: '\bblacksmith-\d+vcpu-windows-2025\b'
        with:  'windows-latest'
      - regex: '\bblacksmith-\d+vcpu-macos-latest\b'
        with:  'macos-latest'
      - plain: "windows-latest-32-arm-core"
        with:  "windows-11-arm"
      - regex: 'useblacksmith/checkout@[0-9a-f]{40} *# v1\b'
        with:  'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2'
      - regex: 'useblacksmith/setup-docker-builder@[0-9a-f]{40} *# v2\b'
        with:  'docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3'
      - regex: 'useblacksmith/build-push-action@[0-9a-f]{40} *# v2\b'
        with:  'docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0'
      - plain: "REIGN_TEST_WORKERS: 32\n"
        with:  "REIGN_TEST_WORKERS: \"\"\n"
  - files:
      - ".github/workflows/tests.yml"
    replace:
      # GitHub's hosted images ship Node; reign1 does not, and the photon sidecar tests shell
      # out to `node`.
      - regex: '(\n    name: Run tests\n(?:(?!      - name: Checkout code).*\n)*?      - name: Checkout code\n        uses: [^\n]+\n)(?!\n      - name: Set up Node)'
        with:  '\1\n      - name: Set up Node\n        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4\n        with:\n          node-version: 26\n'
  - files:
      - ".github/workflows/ci.yaml"
    replace:
      # A large sync diff takes the classifier over a minute (68s on the first sync).
      - regex: '(name: Detect affected areas\n\s+runs-on: ubuntu-latest\n\s+timeout-minutes: )1\n'
        with:  '\g<1>10\n'
  - files:
      - ".github/workflows/contributor-check.yml"
    replace:
      # Upstream maps its contributors at release time; a sync PR brings in every upstream
      # commit since the last sync, so check only Reign's own commits: leave out the history
      # behind each sync merge's upstream parent. Joel's own commits need no mapping.
      - plain: "NEW_EMAILS=$(git log ${MERGE_BASE}..HEAD --format='%ae' --no-merges | sort -u)"
        with:  "UPSTREAM=$(git log ${MERGE_BASE}..HEAD --merges --grep='^Reign: sync with upstream ' --format='%P' | awk '{print \"^\" $2}')\n          # shellcheck disable=SC2086\n          NEW_EMAILS=$(git log ${MERGE_BASE}..HEAD $UPSTREAM --format='%ae' --no-merges | sort -u)"
      - plain: "*teknium*|*noreply@github.com*"
        with:  "*teknium*|*@rampant.llc|*noreply@github.com*"
  - files:
      - "tests/reign_cli/test_verify_console_scripts.py"
    replace:
      # The fixture's indented `hermes-agent = ...` misses the line-start protect and collapses
      # to a second `reign` key, so the TOML declares two scripts and the Windows lane fails.
      - plain: 'reign = "run_agent:main"'
        with:  'reign-agent = "run_agent:main"'
  - files:
      - "tests/e2e/core/upgrade/test_fresh_process_entrypoints.py"
    replace:
      # Same collapse: the `hermes-agent` console-script entry renames to a second `reign` entry,
      # so the matrix never covers the `reign-agent` script.
      - plain: "    \"reign-help\": Entry(\"reign\", (\"--help\",), frozenset({0})),\n}\n"
        with:  "    \"reign-agent-help\": Entry(\"reign-agent\", (\"--help\",), frozenset({0})),\n}\n"
  - files:
      - "apps/desktop/src/lib/connection-display.test.ts"
    replace:
      # `user: 'hermes'` in the fixture renames, but the expected `hermes@studio.example.test`
      # reads as an email and stays protected.
      - plain: "'hermes@studio.example.test:2222'"
        with:  "'reign@studio.example.test:2222'"
  - files:
      - "apps/desktop/scripts/local-pack-publish.test.mjs"
    replace:
      # package.json's repository URL points at the fork (rule above); the owner follows it.
      - plain: "configs[0].owner, 'NousResearch')"
        with:  "configs[0].owner, 'rook-ltd')"
  # The tone-ladder test pins the ladder knobs against the classic gold seeds; Reign ships the
  # Rook monochrome seeds, so the test builds the palette from the gold seeds as a fixture.
  - files:
    - ui-tui/src/__tests__/theme.test.ts
    replace:
    - plain: "    const dark = await importThemeWithCleanEnv()\n    const light = await importThemeWithEnv({ REIGN_TUI_BACKGROUND: '#ffffff' })\n\n    const cases: Array<[string, string, string]> = ["
      with: "    //\n    // The classic (pre-Reign) gold seeds are the FIXTURE here — the shipped\n    // DARK_SEEDS/LIGHT_SEEDS are now the Rook monochrome palette, but the\n    // ladder knobs are still the ones fitted against these literals.\n    const { buildPalette } = await importThemeWithCleanEnv()\n    const dark = {\n      DARK_THEME: {\n        color: buildPalette(\n          {\n            accent: '#FFBF00',\n            activeRow: '#333355',\n            bg: '#101014',\n            border: '#CD7F32',\n            error: '#ef5350',\n            ok: '#4caf50',\n            primary: '#FFD700',\n            prompt: '#FFF8DC',\n            selection: '#3a3a55',\n            shellDollar: '#4dabf7',\n            statusBad: '#FF8C00',\n            statusCritical: '#FF6B6B',\n            statusGood: '#8FBC8F',\n            statusWarn: '#FFD700',\n            surface: '#1a1a2e',\n            text: '#FFF8DC',\n            warn: '#ffa726'\n          },\n          false\n        )\n      }\n\
        \    }\n    const light = {\n      LIGHT_THEME: {\n        color: buildPalette(\n          {\n            accent: '#956E00',\n            bg: '#ffffff',\n            border: '#A56628',\n            error: '#C14240',\n            ok: '#367E39',\n            primary: '#867000',\n            prompt: '#2B2014',\n            shellDollar: '#377BB3',\n            statusBad: '#A65A00',\n            statusCritical: '#B94D4D',\n            statusGood: '#5C7A5C',\n            statusWarn: '#867000',\n            text: '#3D2F13',\n            warn: '#956115'\n          },\n          true\n        )\n      }\n    }\n\n    const cases: Array<[string, string, string]> = ["
  # Joel's call (2026-10-09, when hosted minutes on the private repo had run out): the Windows
  # and macOS lanes run only on a manual dispatch. arm64 images build on GitHub's standard arm64
  # runner (free on a public repo) instead of upstream's 32-core arm64 larger runner.
  - files:
      - ".github/workflows/ci.yaml"
    replace:
      - plain: "on:\n  pull_request:\n  push:\n    branches: [main]\n\n"
        with:  "on:\n  pull_request:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\n"
      - regex: "    if: (needs\\.detect\\.outputs\\.(?:python|installer) == 'true'\n    uses: \\./\\.github/workflows/(?:tests-os|installer-tests)\\.yml)"
        with:  "    if: github.event_name == 'workflow_dispatch' && \\1"
      - regex: "    if: (needs\\.detect\\.outputs\\.python == 'true'[^\n]*)\n    uses: \\./\\.github/workflows/tests-os\\.yml"
        with:  "    if: github.event_name == 'workflow_dispatch' && (\\1)\n    uses: ./.github/workflows/tests-os.yml"
      # Reign ships Rook icons (rebrand/place_images.py), not scripts/generate-icons.mjs output
      # from the nous-girl art, so upstream's freshness diff would always fail.
      - plain: "    needs: detect\n    uses: ./.github/workflows/icons-freshness-check.yml\n"
        with:  "    needs: detect\n    if: false  # Reign ships Rook icons (rebrand/place_images.py)\n    uses: ./.github/workflows/icons-freshness-check.yml\n"
  - files:
      - ".github/workflows/install-e2e.yml"
    replace:
      - regex: "  schedule:\n(?:    #[^\n]*\n)*    - cron: [^\n]*\n"
        with:  ""
      - regex: "if: github\\.event_name != 'workflow_dispatch' \\|\\| (contains\\(fromJSON\\('\\[\"all\", \"(?:windows|macos)-desktop\"\\]'\\), inputs\\.route\\))"
        with:  "if: github.event_name == 'workflow_dispatch' && \\1"
  - files:
      - ".github/workflows/docker.yml"
    replace:
      - plain: "runner: ubuntu-latest-32-arm-core"
        with:  "runner: ubuntu-24.04-arm"

  # reign1's CPU is x86-64-v2 (no AVX2), and setup-python's Ubuntu 26.04 builds need
  # x86-64-v3 ("CPU ISA level is lower than required"). uv's Python builds run on v2, so
  # each setup-python step becomes setup-uv plus a seeded venv on PATH (python, pip).
  - files:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".github/actions/**"
    replace:
      - regex: '(?m)^( *)- (?:name: [^\n]*\n\1  )?uses: actions/setup-python@[0-9a-f]{40}[^\n]*\n\1  with:\n\1    python-version: ["'']?([0-9.]+)["'']?\n'
        with:  '\1- name: Install uv\n\1  uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0\n\1  with:\n\1    version: "0.9.28"\n\1- name: Set up Python \2 (uv)\n\1  shell: bash\n\1  run: |\n\1    uv venv --seed --python \2 "$RUNNER_TEMP/py"\n\1    echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"\n\1    echo "VIRTUAL_ENV=$RUNNER_TEMP/py" >> "$GITHUB_ENV"\n'

  # Install one-liners point at Reign's own installers, not Nous's hosted Hermes ones (the
  # nousresearch.com protect rule otherwise keeps them verbatim and they install Hermes).
  - files:
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install.cmd"
      - "reign_cli/uninstall.py"
      - "reign_cli/update_cmd.py"
      - "reign_cli/update_cmd_maint.py"
      - "skills/autonomous-ai-agents/reign/SKILL.md"
      - "apps/desktop/electron/remote-lifecycle.ts"
      - "apps/desktop/src/i18n/*.ts"
      - "website/docs/**"
    replace:
      - plain: "https://hermes-agent.nousresearch.com/install.sh"
        with:  "https://raw.githubusercontent.com/rook-ltd/reign/main/scripts/install.sh"
      - plain: "https://hermes-agent.nousresearch.com/install.ps1"
        with:  "https://raw.githubusercontent.com/rook-ltd/reign/main/scripts/install.ps1"

  # Public repo: issues and vulnerability reports come to Rook, not Nous (upstream's links
  # survive the nousresearch protect rules otherwise).
  - files:
      - "README.md"
      - "apps/desktop/README.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/*.yml"
      - "SECURITY.md"
    replace:
      - regex: 'https://github\.com/NousResearch/hermes-agent/issues(?!/\d)'
        with:  'https://github.com/rook-ltd/reign/issues'
      - plain: "https://github.com/NousResearch/hermes-agent/security/advisories/new)\nor **security@nousresearch.com**. Do not open"
        with:  "https://github.com/rook-ltd/reign/security/advisories/new).\nDo not open"
      - plain: "the GHSA thread or email correspondence with\n  security@nousresearch.com."
        with:  "the private GitHub Security Advisory thread."

  # The FTS5 trigram self-tests index the brand name and search a 3-letter slice of it; "erm"
  # is in "hermes" but not "reign", so the renamed probe fails and the image cannot build.
  - files:
      - "Dockerfile"
      - "tests/docker/test_sqlite_runtime.py"
    replace:
      - plain: "MATCH 'erm'"
        with:  "MATCH 'eig'"

# Files whose Reign state is fully produced by the rules above (or whose overlay hunks are
# obsolete); make_overlay.py never puts them in the overlay.
overlay_exclude:
  - "tests/reign_cli/test_skin_engine.py"
