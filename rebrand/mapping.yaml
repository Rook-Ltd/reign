# Reign rebrand mapping. Applied by rebrand/rebrand.py in this order:
#   1. delete        - paths removed from the tree (git rm)
#   2. protect       - regexes whose matches are shielded from all replacements
#   3. replace       - ordered content substitutions (first match wins per position)
#   4. rename_paths  - per-path-component substitutions (git mv)
# Everything is case-sensitive unless a rule says otherwise.

exclude_files:            # never touched by content replace
  - LICENSE
  - NOTICE
  - "**/LICENSE"          # nested third-party / plugin licenses keep their copyright holders
  - "**/NOTICE"
  - REIGN-REBRAND-PLAN.md
  - "contributors/**"     # git author identities, not branding
  - "brand/**"
  - "rebrand/**"
  - ".github/workflows/upstream-sync.yml"   # Rook-authored; names upstream on purpose
  - "**/package-lock.json" # regenerated after the run
  - uv.lock
  - flake.lock
  - "tools/wakewords/**"  # deleted below
  - ".git/**"

rename_exclude:           # never MOVED. Everything else in exclude_files still moves with
  - LICENSE               # its renamed directory (nested LICENSE files in plugins/hermes-*)
  - NOTICE
  - REIGN-REBRAND-PLAN.md
  - "contributors/**"
  - "brand/**"
  - "rebrand/**"
  - ".git/**"

delete:
  - README.es.md
  - README.zh-CN.md
  - README.ur-pk.md
  - SECURITY.es.md
  - CONTRIBUTING.es.md
  - website/i18n/zh-Hans            # decision D3
  - "apps/desktop/'"                # upstream junk: tracked /var/folders mutex paths
  - tools/wakewords                 # decision D2: hey_hermes models dropped
  - hermes_agent.egg-info           # stale build metadata tracked upstream
  - MagicMock                       # test pollution if it ever lands upstream

protect:                  # regex; matches are restored verbatim after replacement. ORDER MATTERS:
  # emails first, so the domain rule below cannot shield half of an address. These stay
  # unconditional: example.com addresses here are real commit identities (release.py AUTHOR_MAP).
  - '[\w.+\-]*(?:hermes|nous)[\w.+\-]*@[\w.\-]+\.\w+'
  - '[\w.+\-]+@[\w.\-]*(?:hermes|nous)[\w.\-]*\.\w+'
  # URLs and bare domains pointing at Nous / Hermes properties (decision 8). Placeholder hosts
  # (example.*, *.test, localhost, a bare `host`) are test data, not Nous properties: they rebrand
  # like any other text, so a fixture's input URL and its expected value agree.
  - 'https?://(?![\w.\-:@]*(?:\bexample\.|\.test\b|\blocalhost\b|\b127\.0\.0\.1\b)|host[/:])[^\s"''<>()\[\]`]*(?:[Hh]ermes|[Nn]ous)[^\s"''<>()\[\]`]*'
  - '[\w.-]*nousresearch\.com[^\s"''<>()\[\]`]*'
  # GitHub org/repo slugs and Docker Hub images under the Nous org
  - '[Nn]ous[Rr]esearch/[\w.\-]+'
  # Nous model family identifiers: Hermes 2/3/4(.x) ..., "Nous Hermes"
  - '\b[Hh]ermes[-_ ]?[2-4](?!\d)(?:\.\d+)?(?:[-_][A-Za-z0-9.]+)*'   # also hermes_4_70b; not hermes_2026-...
  # Model-family detection needles: a bare lowercase "hermes" compared against a
  # model id (agent/coding_context.py, reign_cli/auth.py, model_switch.py regex,
  # godmode auto_jailbreak.py). These must keep matching Nous model names.
  - '"hermes"(?=, "llama")'
  - '(?<=if )"hermes"(?= in (?:mid|model_lower))'
  - '(?<=\[/:\]\))hermes(?=\[-_ \]\?\[34\])'
  # Skill frontmatter key `metadata.hermes` is a schema identifier shared with hub skills
  # and read by a changing set of upstream files; keep it `hermes` everywhere (decided 2026-10-06).
  - '(?m)^(\s+)hermes:\s*$'
  - 'metadata:\\n *hermes:\\n'           # inline yaml in test strings (literal backslash-n)
  - '(?:metadata|meta|meta_block|fm|frontmatter|block)\.get\("hermes"'
  - '(?:metadata|meta_block|fm|frontmatter)\["hermes"\]'
  - '(?m)^\s*"\s+hermes:\\n"'          # split string-literal yaml line in test fixtures
  - '"metadata":\s*\{\s*"hermes":'    # dict-literal writer of a skill metadata block
  - '"hermes" (?:not )?in (?:meta|metadata|fm|frontmatter|block)\b'
  - 'metadata\.hermes\b'
  - 'maintainer[=:] *"?Nous Research"?'   # third-party plugin maintainers in the catalog and its tests
  - 'metadata\[\"hermes\"\]'
  - '\["metadata"\](?:\["hermes"\]|\.get\("hermes")'                       # fm["metadata"]["hermes"] / fm["metadata"].get("hermes")
  - 'get\("metadata"\)[^)\n]*\)\.get\("hermes"'                                # (fm.get("metadata") or {}).get("hermes")
  - '"  hermes:"'                      # yaml line writer (tools/skills_hub.py)
  # Nous API server message matched by the error classifier (wire text, both cases)
  - '(?i)anonymous hermes agent accounts only'
  # legacy-cli test resolves the agent console script by name
  - '\["scripts"\]\["hermes-agent"\]'
  # The `hermes-agent` console script / launcher must not collapse into `hermes`->`reign`
  # (it would overwrite the CLI launcher). Kept here, mapped to reign-agent in post_replace.
  - 'command_link_dir/hermes-agent'
  - 'command_link_dir / "hermes-agent"'
  - 'Installed hermes-agent launcher'
  - 'expose `hermes-agent`\. The `hermes-agent` console script'
  - 'hermes-agent must dispatch'
  - '"hermes-agent", "hermes-acp"'
  - '"hermes-acp", "hermes-agent"'
  - 'prog="hermes-agent"'
  - '"bin" / "hermes-agent"'
  - '/usr/local/bin/hermes-agent"'
  - '(?m)^hermes-agent = "'
  # Hand-edited lines that keep "hermes" on purpose (so re-running the codemod
  # over an already-branded tree is a no-op)
  - 'meta(?:data|_block)?\.get\("hermes"\)'
  - '\[Hermes Agent\]\([^)]*\) by Nous Research'   # URL span is already shielded by then
  - 'Built on Hermes Agent \(MIT\)'
  - 'hermes-agent\.nousresearch\.\.\.'
  - '`"hermes" in name\.lower\(\)`'
  - 'hermes-brain:qwen3-14b-ctx16k'
  - 'carry "hermes" in their tag'
  # Named security incident and a contributor handle cited in code comments
  - 'hermes-0day'
  - '@5L-hermes01'
  - '[Nn]ous[- ][Hh]ermes\b'
  # Third-party npm scope (Nous design system package), not our branding
  - '@nous-research/[\w.\-]+'
  # Docusaurus org/project fields are link plumbing for editUrl
  - "organizationName: '[^']*'"

replace:                  # ordered; {plain} or {regex}
  - plain: "Nous Research · Messenger of the Digital Gods"
    with:  "Rook · In Your Corner"
  - plain: "Messenger of the Digital Gods"
    with:  "In Your Corner"
  - plain: "NOUS HERMES"
    with:  "REIGN"
  - plain: "com.nousresearch.hermes"
    with:  "com.rook.reign"
  - regex: "Nous Research(?! Portal)"
    with:  "Rook"
  - plain: "NOUS RESEARCH"
    with:  "ROOK"
  - plain: "Hermes Agent"
    with:  "Reign"
  - plain: "Hermes agent"
    with:  "Reign"
  - plain: "HERMES AGENT"
    with:  "REIGN"
  - plain: "HERMES-AGENT"
    with:  "REIGN"
  - plain: "Hermes-Agent"
    with:  "Reign"
  - plain: "hermes-agent"
    with:  "reign"
  - plain: "⚕"
    with:  "♜"
  - plain: "☤"
    with:  "♜"
  - plain: "hermes"
    with:  "reign"
  - plain: "Hermes"
    with:  "Reign"
  - plain: "HERMES"
    with:  "REIGN"

rename_paths:             # applied to each path component, in order
  - plain: "hermes-agent"
    with:  "reign"
  - plain: "hermes"
    with:  "reign"
  - plain: "Hermes"
    with:  "Reign"
  - plain: "HERMES"
    with:  "REIGN"

# Residual-check allowlist: lines matching these after the run are expected.
check_allow:
  - '(?i)anonymous hermes agent accounts only'
  # skill metadata key kept as `hermes` (decision 2026-10-06)
  - '(?m)^\s+hermes:\s*$'
  - 'metadata\.hermes\b'
  - 'metadata:\\n *hermes:'
  - '\["metadata"\]'
  - 'get\("metadata"\)'
  - '\.get\("hermes"'
  - '\["hermes"\]'
  - '"hermes":'
  - '"  hermes:"'
  # intentional survivors after the manual model-needle / skill-key fixes
  - 'get\("hermes"\)'
  - '"hermes" in (?:mid|model_lower|name)'
  - '"hermes", "llama"'
  - 'hermes-brain'
  - 'hermes\[-_ \]\?\[34\]'
  - 'hermes-agent\.nousresearch\.\.\.'
  - '[Nn]ous[Rr]esearch/[\w.\-]+'          # org/repo slugs, ghcr/docker images
  - '[\w.-]*nousresearch\.com[^\s"''<>)]*' # bare domains
  - '\bnous_\w+|\w+_nous\w*'              # Nous Portal provider snake_case identifiers
  - '\bNOUS_'                             # NOUS_API_KEY, NOUS_MANAGED_PROVIDER, 'NOUS_' prefix literals
  - '\bnous[A-Z]\w*'                      # camelCase: nousAuthSignIn, nousTheme ...
  - 'noUsage\w*|noUser\w*'                # false positives: "noUsage", "noUserInfo" contain "nous"
  - 'NOUS-\d+'                             # Nous Portal OAuth device-code fixtures
  - 'hermes-(?:estree|parser)\b'           # third-party npm packages (Facebook Hermes JS)
  - '[Nn]ous[Rr]esearch'
  - 'nousresearch\.com'
  - '[Hh]ermes[-_ ]?[2-4](?:\.\d+)?'
  - 'hermes-0day'
  - '5L-hermes01'
  - '[Nn]ous[- ][Hh]ermes'
  - '@nous-research/'
  - '\bnous\b'                 # provider key for Nous Portal
  - '\bNous\b'                 # Nous Portal / NousPortalAdapter etc.
  - 'Nous[A-Z][A-Za-z]+'       # NousPortalAdapter, NousCloud, NousProfile ...
  - '(?:hermes|nous)[\w.+\-]*@|@[\w.\-]*(?:hermes|nous)'   # emails
  - '(?i)https?://[^\s]*(?:hermes|nous)'
  - '(?i)github\.com/[\w.-]+/[\w.-]*hermes[\w.-]*'   # third-party plugin repos
  - '~?nouser\b'

# Post-run manual fixes that are NOT codemod-able (see REIGN-REBRAND-PLAN.md Phase 4):
#  - skill frontmatter key: code reads metadata.reign OR metadata.hermes (hub skills publish `hermes:`)
#  - nested LICENSE files keep their upstream copyright holders (excluded above)

# Stage 5: post_replace — applied AFTER the protected spans are restored, only
# to the listed files. Repoints the code-fetch paths (install, update, zip
# fallback, official-repo detection, release links, user agents) at the Rook
# distribution repo. Documentation links stay on upstream (decision 8).
post_replace:
  - files:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/dev-sandbox.sh"
      - "scripts/release.py"
      - "tests/install/*"
      - ".github/actions/**"        # plugin-validate installs the agent from the repo
      - "reign_cli/**"
      - "tests/reign_cli/**"
      - "tests/scripts/**"
      - "apps/desktop/electron/update-remote*"
      - "apps/desktop/electron/bootstrap-runner.ts"
      - "apps/desktop/src/app/settings/about-settings.tsx"
      - "apps/desktop/src/components/onboarding/index.tsx"
      - "apps/desktop/package.json"
      - "nix/*.nix"
      - "tools/discord_tool.py"
      - "gateway/relay/media.py"
      - "plugins/image_gen/openrouter/__init__.py"
      - "optional-skills/research/osint-investigation/scripts/_http.py"
      - "tests/reign_cli/test_update*.py"
      - "tests/reign_cli/test_banner_git_state.py"
      - "tests/reign_cli/test_lazy_refresh_venv_repair.py"
      - "tests/reign_cli/test_cmd_update.py"
    replace:
      - plain: "https://github.com/NousResearch/hermes-agent.git"
        with:  "https://github.com/asxi9832/reign.git"
      - plain: "git@github.com:NousResearch/hermes-agent.git"
        with:  "git@github.com:asxi9832/reign.git"
      - plain: "https://github.com/NousResearch/hermes-agent"
        with:  "https://github.com/asxi9832/reign"
      - plain: "git@github.com:NousResearch/hermes-agent"
        with:  "git@github.com:asxi9832/reign"
      - plain: "https://raw.githubusercontent.com/NousResearch/hermes-agent"
        with:  "https://raw.githubusercontent.com/asxi9832/reign"
      - plain: "ssh://git@github.com/NousResearch/hermes-agent"
        with:  "ssh://git@github.com/asxi9832/reign"
      - plain: "git@github.com:nousresearch/hermes-agent"
        with:  "git@github.com:asxi9832/reign"
      - plain: "github.com/nousresearch/hermes-agent"
        with:  "github.com/asxi9832/reign"
      - plain: "updates from NousResearch/hermes-agent"
        with:  "updates from asxi9832/reign"
      - plain: "canonical NousResearch/hermes-agent repo"
        with:  "canonical asxi9832/reign repo"
      - plain: "_HERMES_REF"
        with:  "_REIGN_REF"
      - plain: '"nousresearch/hermes-agent"'
        with:  '"asxi9832/reign"'
  - files:
      - "scripts/install.sh"
      - "**/test_install_sh_acp_launcher.py"
      - "reign_cli/profiles.py"
      - "reign_cli/main.py"
      - "reign_cli/uninstall.py"
      - "pyproject.toml"
    replace:
      - plain: "command_link_dir/hermes-agent"
        with:  "command_link_dir/reign-agent"
      - plain: 'command_link_dir / "hermes-agent"'
        with:  'command_link_dir / "reign-agent"'
      - plain: "Installed hermes-agent launcher"
        with:  "Installed reign-agent launcher"
      - plain: "expose `hermes-agent`. The `hermes-agent` console script"
        with:  "expose `reign-agent`. The `reign-agent` console script"
      - plain: "hermes-agent must dispatch"
        with:  "reign-agent must dispatch"
      - regex: '(?m)^hermes-agent = "'
        with:  'reign-agent = "'
      - plain: 'REIGN_BIN="$(which hermes 2>/dev/null'
        with:  'REIGN_BIN="$(which reign 2>/dev/null'
  - files:                # exact console-script name strings, safe tree-wide
      - "**/*.py"
      - "**/*.sh"
      - "**/*.ps1"
      - "**/*.ts"
      - "**/*.tsx"
    replace:
      - plain: '"hermes-agent", "hermes-acp"'
        with:  '"reign-agent", "reign-acp"'
      - plain: '"hermes-acp", "hermes-agent"'
        with:  '"reign-acp", "reign-agent"'
      - plain: 'prog="hermes-agent"'
        with:  'prog="reign-agent"'
      - plain: '["scripts"]["hermes-agent"]'
        with:  '["scripts"]["reign-agent"]'
      - plain: '"bin" / "hermes-agent"'
        with:  '"bin" / "reign-agent"'
      - plain: '/usr/local/bin/hermes-agent"'
        with:  '/usr/local/bin/reign-agent"'
  - files:                # kawaii text faces in CLI output -> neutral glyphs (order matters)
      - "cli.py"
      - "reign_cli/*.py"
      - "gateway/*.py"
    replace:
      - plain: "✨ (◕‿◕)✨ "
        with:  ""
      - plain: "ヽ(^o^)ノ"
        with:  ""
      - plain: "  Total: {len(tools)} tools  \""
        with:  "  Total: {len(tools)} tools\""
      - plain: "(^o^)/"
        with:  "♜"
      - plain: "(^_^)b"
        with:  "✓"
      - plain: "(^_^)v"
        with:  "✓"
      - plain: "(^_^)/"
        with:  "♜"
      - plain: "(^_^)?"
        with:  "[?]"
      - regex: '" " \* (\d+) \+ "\(\^_\^\) ([^"]+)" \+ " " \* (\d+) \+ "\|"'
        with:  '" " * \1 + "  ♜ \2" + " " * \3 + "  |"'
      - plain: "(^_^)"
        with:  "♜"
      - plain: "(x_x)"
        with:  "✗"
      - plain: "(>_<)"
        with:  "✗"
      - plain: "(;_;)"
        with:  "✗"
      - plain: "(o_o)"
        with:  "›"
      - plain: "(-_-)zzZ"
        with:  "…"
  - files:                # dashboard sidebar abbreviation "HA" (Hermes Agent)
      - "web/src/i18n/*.ts"
    replace:
      - plain: 'brandShort: "HA"'
        with:  'brandShort: "RG"'
  # ---- rule-owned brand surfaces (promoted from the hand-edit overlay, 2026-10-06) ----
  - files:
    - reign_cli/banner.py
    - cli.py
    replace:
    - regex: (?s)REIGN_AGENT_LOGO = """.*?"""
      with: 'REIGN_AGENT_LOGO = """[bold #FFFFFF]██████╗ ███████╗██╗ ██████╗ ███╗   ██╗[/]

        [bold #FFFFFF]██╔══██╗██╔════╝██║██╔════╝ ████╗  ██║[/]

        [#C0C0C0]██████╔╝█████╗  ██║██║  ███╗██╔██╗ ██║[/]

        [#C0C0C0]██╔══██╗██╔══╝  ██║██║   ██║██║╚██╗██║[/]

        [#8A8A8A]██║  ██║███████╗██║╚██████╔╝██║ ╚████║[/]

        [#8A8A8A]╚═╝  ╚═╝╚══════╝╚═╝ ╚═════╝ ╚═╝  ╚═══╝[/]"""'
