# Reign rebrand mapping. Applied by rebrand/rebrand.py in this order:
#   1. delete        - paths removed from the tree (git rm)
#   2. protect       - regexes whose matches are shielded from all replacements
#   3. replace       - ordered content substitutions (first match wins per position)
#   4. rename_paths  - per-path-component substitutions (git mv)
# Everything is case-sensitive unless a rule says otherwise.

exclude_files:            # never touched by content replace, never renamed
  - LICENSE
  - NOTICE
  - "**/LICENSE"          # nested third-party / plugin licenses keep their copyright holders
  - "**/NOTICE"
  - REIGN-REBRAND-PLAN.md
  - "contributors/**"     # git author identities, not branding
  - "brand/**"
  - "rebrand/**"
  - "**/package-lock.json" # regenerated after the run
  - uv.lock
  - flake.lock
  - "tools/wakewords/**"  # deleted below
  - ".git/**"

delete:
  - README.es.md
  - README.zh-CN.md
  - README.ur-pk.md
  - SECURITY.es.md
  - CONTRIBUTING.es.md
  - website/i18n/zh-Hans            # decision D3
  - "apps/desktop/'"                # upstream junk: tracked /var/folders mutex paths
  - tools/wakewords                 # decision D2: hey_hermes models dropped

protect:                  # regex; matches are restored verbatim after replacement. ORDER MATTERS:
  # emails first, so the domain rule below cannot shield half of an address
  - '[\w.+\-]*(?:hermes|nous)[\w.+\-]*@[\w.\-]+\.\w+'
  - '[\w.+\-]+@[\w.\-]*(?:hermes|nous)[\w.\-]*\.\w+'
  # URLs and bare domains pointing at Nous / Hermes properties (decision 8)
  - 'https?://[^\s"''<>()\[\]`]*(?:[Hh]ermes|[Nn]ous)[^\s"''<>()\[\]`]*'
  - '[\w.-]*nousresearch\.com[^\s"''<>()\[\]`]*'
  # GitHub org/repo slugs and Docker Hub images under the Nous org
  - '[Nn]ous[Rr]esearch/[\w.\-]+'
  # Nous model family identifiers: Hermes 2/3/4(.x) ..., "Nous Hermes"
  - '\b[Hh]ermes[-_ ]?[2-4](?:\.\d+)?(?:[-_][A-Za-z0-9.]+)*'   # also hermes_4_70b
  # Model-family detection needles: a bare lowercase "hermes" compared against a
  # model id (agent/coding_context.py, reign_cli/auth.py, model_switch.py regex,
  # godmode auto_jailbreak.py). These must keep matching Nous model names.
  - '"hermes"(?=, "llama")'
  - '(?<=if )"hermes"(?= in (?:mid|model_lower))'
  - '(?<=\[/:\]\))hermes(?=\[-_ \]\?\[34\])'
  # Named security incident and a contributor handle cited in code comments
  - 'hermes-0day'
  - '@5L-hermes01'
  - '[Nn]ous[- ][Hh]ermes\b'
  # Third-party npm scope (Nous design system package), not our branding
  - '@nous-research/[\w.\-]+'
  # Docusaurus org/project fields are link plumbing for editUrl
  - "organizationName: '[^']*'"

replace:                  # ordered; {plain} or {regex}
  - plain: "Nous Research · Messenger of the Digital Gods"
    with:  "Rook · In Your Corner"
  - plain: "Messenger of the Digital Gods"
    with:  "In Your Corner"
  - plain: "NOUS HERMES"
    with:  "REIGN"
  - plain: "com.nousresearch.hermes"
    with:  "com.rook.reign"
  - regex: "Nous Research(?! Portal)"
    with:  "Rook"
  - plain: "NOUS RESEARCH"
    with:  "ROOK"
  - plain: "Hermes Agent"
    with:  "Reign"
  - plain: "Hermes agent"
    with:  "Reign"
  - plain: "HERMES AGENT"
    with:  "REIGN"
  - plain: "HERMES-AGENT"
    with:  "REIGN"
  - plain: "Hermes-Agent"
    with:  "Reign"
  - plain: "hermes-agent"
    with:  "reign"
  - plain: "⚕"
    with:  "♜"
  - plain: "hermes"
    with:  "reign"
  - plain: "Hermes"
    with:  "Reign"
  - plain: "HERMES"
    with:  "REIGN"

rename_paths:             # applied to each path component, in order
  - plain: "hermes-agent"
    with:  "reign"
  - plain: "hermes"
    with:  "reign"
  - plain: "Hermes"
    with:  "Reign"
  - plain: "HERMES"
    with:  "REIGN"

# Residual-check allowlist: lines matching these after the run are expected.
check_allow:
  # intentional survivors after the manual model-needle / skill-key fixes
  - 'get\("hermes"\)'
  - '"hermes" in (?:mid|model_lower|name)'
  - '"hermes", "llama"'
  - 'hermes-brain'
  - 'hermes\[-_ \]\?\[34\]'
  - 'hermes-agent\.nousresearch\.\.\.'
  - '[Nn]ous[Rr]esearch/[\w.\-]+'          # org/repo slugs, ghcr/docker images
  - '[\w.-]*nousresearch\.com[^\s"''<>)]*' # bare domains
  - '\bnous_\w+|\w+_nous\w*'              # Nous Portal provider snake_case identifiers
  - '\bNOUS_\w+'                          # NOUS_API_KEY, NOUS_MANAGED_PROVIDER ...
  - '\bnous[A-Z]\w*'                      # camelCase: nousAuthSignIn, nousTheme ...
  - 'noUsage\w*|noUser\w*'                # false positives: "noUsage", "noUserInfo" contain "nous"
  - 'NOUS-\d+'                             # Nous Portal OAuth device-code fixtures
  - 'hermes-(?:estree|parser)\b'           # third-party npm packages (Facebook Hermes JS)
  - '[Nn]ous[Rr]esearch'
  - 'nousresearch\.com'
  - '[Hh]ermes[-_ ]?[2-4](?:\.\d+)?'
  - 'hermes-0day'
  - '5L-hermes01'
  - '[Nn]ous[- ][Hh]ermes'
  - '@nous-research/'
  - '\bnous\b'                 # provider key for Nous Portal
  - '\bNous\b'                 # Nous Portal / NousPortalAdapter etc.
  - 'Nous[A-Z][A-Za-z]+'       # NousPortalAdapter, NousCloud, NousProfile ...
  - '(?:hermes|nous)[\w.+\-]*@|@[\w.\-]*(?:hermes|nous)'   # emails
  - 'https?://[^\s]*(?:hermes|nous)'

# Post-run manual fixes that are NOT codemod-able (see REIGN-REBRAND-PLAN.md Phase 4):
#  - skill frontmatter key: code reads metadata.reign OR metadata.hermes (hub skills publish `hermes:`)
#  - nested LICENSE files keep their upstream copyright holders (excluded above)

# Stage 5: post_replace — applied AFTER the protected spans are restored, only
# to the listed files. Repoints the code-fetch paths (install, update, zip
# fallback, official-repo detection, release links, user agents) at the Rook
# distribution repo. Documentation links stay on upstream (decision 8).
post_replace:
  - files:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/dev-sandbox.sh"
      - "scripts/release.py"
      - "tests/install/*"
      - "reign_cli/update_cmd.py"
      - "reign_cli/banner.py"
      - "apps/desktop/electron/update-remote*"
      - "apps/desktop/electron/bootstrap-runner.ts"
      - "apps/desktop/src/app/settings/about-settings.tsx"
      - "apps/desktop/src/components/onboarding/index.tsx"
      - "apps/desktop/package.json"
      - "nix/*.nix"
      - "tools/discord_tool.py"
      - "gateway/relay/media.py"
      - "plugins/image_gen/openrouter/__init__.py"
      - "optional-skills/research/osint-investigation/scripts/_http.py"
      - "tests/reign_cli/test_update*.py"
      - "tests/reign_cli/test_banner_git_state.py"
      - "tests/reign_cli/test_lazy_refresh_venv_repair.py"
      - "tests/reign_cli/test_cmd_update.py"
    replace:
      - plain: "https://github.com/NousResearch/hermes-agent.git"
        with:  "https://github.com/asxi9832/reign.git"
      - plain: "git@github.com:NousResearch/hermes-agent.git"
        with:  "git@github.com:asxi9832/reign.git"
      - plain: "https://github.com/NousResearch/hermes-agent"
        with:  "https://github.com/asxi9832/reign"
      - plain: "git@github.com:NousResearch/hermes-agent"
        with:  "git@github.com:asxi9832/reign"
      - plain: "https://raw.githubusercontent.com/NousResearch/hermes-agent"
        with:  "https://raw.githubusercontent.com/asxi9832/reign"
      - plain: "ssh://git@github.com/NousResearch/hermes-agent"
        with:  "ssh://git@github.com/asxi9832/reign"
      - plain: "git@github.com:nousresearch/hermes-agent"
        with:  "git@github.com:asxi9832/reign"
      - plain: "github.com/nousresearch/hermes-agent"
        with:  "github.com/asxi9832/reign"
      - plain: "updates from NousResearch/hermes-agent"
        with:  "updates from asxi9832/reign"
      - plain: "canonical NousResearch/hermes-agent repo"
        with:  "canonical asxi9832/reign repo"
