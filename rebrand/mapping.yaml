        [#8A8A8A]⠀⠀⠻⣆⠀⠀⠀⠀⠀⢀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⠀⠀⠀⠀⠀⠀⣰⠟⠀⠀[/]

        [#8A8A8A]⠀⠀⠀⠙⢷⣄⠀⠀⣠⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣄⠀⠀⣠⡾⠋⠀⠀⠀[/]

