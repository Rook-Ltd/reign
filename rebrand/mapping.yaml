      with: 'Reign bundles **no** model for it: set `openwakeword.model` to a custom `.tflite` file.'
    - plain: "The default phrase label is **\"hey reign\"**. For openWakeWord, Reign includes\nits trained TFLite model.\n"
      with: "The default phrase is **\"hey reign\"**, detected by sherpa with no trained model. Reign\nships no openWakeWord model.\n"
  - files:
    - tests/tools/test_wake_word.py
    replace:
    - plain: assert ww._provider({}) == "openwakeword"
      with: assert ww._provider({}) == "sherpa"
      with: 'assert ww._provider({}) == "sherpa"'
