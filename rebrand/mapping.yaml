    replace:
    - plain: "/** The friendly violet the primary profile has always worn, and the last\n *  resort for a draft that has no name to derive a hue from yet. */\nconst PRIMARY_AVATAR_COLOR = '#8b5cf6'"
      with: "/** Rook green for the primary profile, and the last resort for a draft that\n *  has no name to derive a hue from yet. */\nconst PRIMARY_AVATAR_COLOR = '#4A9D6B'"
    - plain: "primary a nice fixed generic look (a friendly violet squircle)."
      with: "primary a nice fixed generic look (a Rook green squircle)."
  # Dashboard sidebar header: the Rook outline mark (masked, takes the theme's midground)
